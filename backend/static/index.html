<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Otto · Asistente de Odoo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=JetBrains+Mono:wght@100..900&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="topbar">
  <div class="bar-inner">
    <div class="brand">
      <div class="ai-avatar"><span class="ms">bolt</span></div>
      <div class="brand-name">Otto</div>
      <div class="divider"></div>
      <div id="health" class="conn"><span class="dot"></span><span class="conn-text">Conectando a Odoo</span></div>
    </div>
    <nav class="nav">
      <button class="icon-btn" title="Nueva conversación" id="btnNew"><span class="ms">add</span></button>
      <button class="icon-btn" title="Ajustes"><span class="ms">settings</span></button>
      <div class="user-avatar"><span class="ms">person</span></div>
    </nav>
  </div>
</header>

<main class="main">
  <div class="thread">
    <div id="empty" class="empty">
      <div class="ai-avatar lg"><span class="ms">bolt</span></div>
      <p class="empty-title">Pregúntale a Otto sobre tu Odoo</p>
      <p class="hint">Stock disponible, ventas del mes, top de productos, gráficos y más.</p>
    </div>
    <div id="chat"></div>
  </div>
</main>

<div class="dock">
  <form id="form" class="commandbar">
    <textarea id="input" rows="1" placeholder="Escribe un mensaje a Otto..." autocomplete="off"></textarea>
    <button id="send" type="submit" title="Enviar"><span class="ms">arrow_upward</span></button>
  </form>
  <p class="disclaimer">Otto puede cometer errores. Considera verificar la información importante.</p>
</div>

<script src="/static/vendor/purify.min.js"></script>
<script src="/static/vendor/marked.min.js"></script>
<script src="/static/vendor/chart.umd.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
